name: Wefto CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  product:
    name: Product (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: windows-2025
            target: windows-x64
          - runner: macos-15
            target: macos-arm64
    defaults:
      run:
        shell: bash
        working-directory: magpie
    env:
      GOENV: 'off'
      GOTOOLCHAIN: local
      GOWORK: 'off'

    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: magpie/go.mod
          cache: false

      - name: Install the pinned Node toolchain
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: magpie/.node-version
          package-manager-cache: false

      - name: Resolve the macOS temporary directory
        if: runner.os == 'macOS'
        run: |
          canonical_temp="$(cd "${TMPDIR:-/tmp}" && pwd -P)"
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$canonical_temp" "$canonical_temp" "$canonical_temp" >> "$GITHUB_ENV"

      - name: Configure the Windows race compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $command = Get-Command gcc -ErrorAction SilentlyContinue
          $gcc = if ($command) { $command.Source } else {
            @('C:\msys64\mingw64\bin\gcc.exe', 'C:\mingw64\bin\gcc.exe') |
              Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }
          if (!$gcc) { throw 'The Windows runner must provide MinGW-w64 gcc for Go race tests.' }
          $target = & $gcc -dumpmachine
          if ($LASTEXITCODE -ne 0 -or $target -notmatch 'x86_64.*mingw') {
            throw "Expected a Windows x64 MinGW compiler; got: $target"
          }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Split-Path -Parent $gcc)
          Add-Content -LiteralPath $env:GITHUB_ENV -Value 'CC=gcc'
          & $gcc --version

      - name: Prepare locked dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --cache ./dist/cache/npm --userconfig ./dist/npm-user.npmrc --globalconfig ./dist/npm-global.npmrc
          go mod download
          git diff --exit-code

      - name: Install Linux browsers and system libraries
        if: runner.os == 'Linux'
        run: npm run browsers:install -- --with-deps

      - name: Install native Windows or macOS browsers
        if: runner.os != 'Linux'
        run: npm run browsers:install

      - name: Check the regression entry
        run: npm run test:entry

      - name: Run the complete offline product gate
        run: |
          npm test -- --output=dist/regression/ci
          node -e 'const assert = require("node:assert/strict"); const s = require("./dist/regression/ci/summary.json"); assert.equal(s.status, "passed"); assert.equal(s.complete, true); assert.equal(s.candidate.trackedDirty, false); assert.equal(s.candidate.sha, process.env.GITHUB_SHA);'

      - name: Preserve regression evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wefto-regression-${{ matrix.target }}-${{ github.run_attempt }}
          path: magpie/dist/regression/
          if-no-files-found: warn
          retention-days: 14
