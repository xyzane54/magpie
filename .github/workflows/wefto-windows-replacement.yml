name: Wefto Windows replacement diagnostic
on:
  push:
    branches: [codex/wefto-file-replacement-diagnostic]
permissions:
  contents: read
jobs:
  replacement:
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        working-directory: magpie
        shell: pwsh
    env:
      GOENV: 'off'
      GOTOOLCHAIN: local
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: magpie/go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: magpie/.node-version
          package-manager-cache: false
      - name: Prepare the native race compiler and locked modules
        run: |
          $command = Get-Command gcc -ErrorAction SilentlyContinue
          $gcc = if ($command) { $command.Source } else {
            @('C:\msys64\mingw64\bin\gcc.exe', 'C:\mingw64\bin\gcc.exe') | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }
          if (!$gcc) { throw 'Native MinGW-w64 gcc is required' }
          $target = & $gcc -dumpmachine
          if ($LASTEXITCODE -ne 0 -or $target -notmatch 'x86_64.*mingw') { throw 'Expected native x64 MinGW-w64 gcc' }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Split-Path -Parent $gcc)
          Add-Content -LiteralPath $env:GITHUB_ENV -Value 'CC=gcc'
          go mod download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compare original and coordinated Windows I/O
        run: node ../.github/scripts/wefto-windows-replacement.cjs
      - name: Preserve source identity and comparison logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wefto-windows-replacement-diagnostic
          path: magpie/dist/replacement-diagnostic/
          retention-days: 14
